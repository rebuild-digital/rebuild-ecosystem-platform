# Typecheck, unit tests and a schema/migration drift check on every PR and on pushes to main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The committed migrations must match src/server/db/schema.ts.
      - name: Migrations match the schema
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle)" || { git status --short -- drizzle; echo "Schema changed without a migration: run npm run db:generate and commit drizzle/"; exit 1; }
